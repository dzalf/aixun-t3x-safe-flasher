# Runs the whole test suite on every push and pull request. No station and no firmware are
# needed: the tests use the built-in simulator, and the GUI tests run headless (offscreen).
# The one test that needs real firmware images is skipped here.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: System libraries Qt needs (also headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3

      - name: Install the package with test and GUI extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v -rs

      - name: Shell script lint
        run: shellcheck tools/aixun.sh
